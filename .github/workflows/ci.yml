name: CI

on:
  push:
    branches: [main]
    # A version tag (v0.2.0-alpha.1) also builds the installers and drafts a GitHub release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      llm_smoke:
        description: "Also run a real agent turn in the packaged-app smoke test (uses OpenCode's free models; needs network)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package + smoke test (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            builder: --mac --arm64
          - target: mac-x64
            runner: macos-15-intel
            builder: --mac --x64
          - target: linux-x64
            runner: ubuntu-24.04
            builder: --linux --x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            builder: --linux --arm64
    runs-on: ${{ matrix.runner }}
    env:
      PEER_SMOKE_LLM: ${{ inputs.llm_smoke && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch OpenCode runtime for ${{ matrix.target }}
        run: node scripts/fetch-opencode.mjs --target ${{ matrix.target }}
      - run: npm run build

      - name: Package (macOS, signed + notarized when secrets are configured)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_API_KEY_CONTENT" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
            fi
            npx electron-builder ${{ matrix.builder }} --publish never
          else
            # No Developer ID: sign ad-hoc ("-"). Apple Silicon refuses to run unsigned code, and an
            # ad-hoc signature needs no Apple account. Not notarized, so Gatekeeper still warns about
            # a browser-downloaded DMG; scripts/install.sh (curl) avoids that.
            echo "::warning::No signing certificate configured; building an ad-hoc signed app (not notarized)."
            # electron-builder skips all signing on pull-request builds to protect certificates;
            # an ad-hoc signature uses no secret, so force it and keep PR builds like release builds.
            CSC_FOR_PULL_REQUEST=true CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.builder }} --publish never -c.mac.identity=-
          fi

      - name: Verify code signature (and notarization when signed)
        if: runner.os == 'macOS'
        env:
          HAS_CERT: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          APP=$(ls -d release/mac*/Peer.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/opencode/opencode"
          codesign -dv "$APP" 2>&1 | grep -E "^(Signature|TeamIdentifier|Runtime)" || true
          # The zip is what scripts/install.sh installs: check the signature survives the round trip.
          ZIP=$(ls release/*.zip | head -1)
          rm -rf "$RUNNER_TEMP/zipcheck" && ditto -x -k "$ZIP" "$RUNNER_TEMP/zipcheck"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/zipcheck/Peer.app"
          if [ "$HAS_CERT" = "true" ]; then
            spctl --assess --type execute --verbose "$APP" || echo "::warning::Gatekeeper assessment failed (not notarized?)"
          fi

      - name: Smoke test packaged app (macOS)
        if: runner.os == 'macOS'
        run: node scripts/smoke-packaged.mjs

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "$(uname -m)" = "aarch64" ]; then
            # electron-builder's bundled fpm (used for .deb) is x86_64-only.
            sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential
            sudo gem install --no-document fpm
            export USE_SYSTEM_FPM=true
          fi
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Install runtime dependencies for headless Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libfuse2t64

      - name: Smoke test unpacked app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs

      - name: Smoke test AppImage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --appimage

      - name: Install .deb and smoke test the installed app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          xvfb-run -a node scripts/smoke-packaged.mjs --exec /opt/Peer/peer

      # Installers are ~330 MB each; upload them only for a manual run or a version tag, so pushes
      # and PRs don't fill the repository's Actions storage quota.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: peer-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  # A version tag drafts a GitHub release with every installer, SHA256SUMS.txt and install.sh.
  # It stays a draft: a human reviews the notes and assets, then publishes it.
  release:
    name: Draft GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: peer-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cp scripts/install.sh assets/install.sh
          cd assets
          ls -la
          sha256sum -- *.dmg *.zip *.AppImage *.deb install.sh > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$VERSION.md"
          [ -f "$NOTES" ] || { echo "::error::Missing release notes: $NOTES"; exit 1; }
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $PRE --verify-tag \
            --title "Peer $VERSION" --notes-file "$NOTES" \
            assets/*.dmg assets/*.zip assets/*.AppImage assets/*.deb assets/install.sh assets/SHA256SUMS.txt
