name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      llm_smoke:
        description: "Also run a real agent turn in the packaged-app smoke test (uses OpenCode's free models; needs network)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Package + smoke test (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
            builder: --mac --arm64
          - target: mac-x64
            runner: macos-15-intel
            builder: --mac --x64
          - target: linux-x64
            runner: ubuntu-24.04
            builder: --linux --x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            builder: --linux --arm64
    runs-on: ${{ matrix.runner }}
    env:
      PEER_SMOKE_LLM: ${{ inputs.llm_smoke && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch OpenCode runtime for ${{ matrix.target }}
        run: node scripts/fetch-opencode.mjs --target ${{ matrix.target }}
      - run: npm run build

      - name: Package (macOS, signed + notarized when secrets are configured)
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            if [ -n "$APPLE_API_KEY_CONTENT" ]; then
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
            fi
            npx electron-builder ${{ matrix.builder }} --publish never
          else
            echo "::warning::No signing certificate configured; building an unsigned app."
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.builder }} --publish never -c.mac.identity=null
          fi

      - name: Verify signature and notarization
        if: runner.os == 'macOS' && env.HAS_CERT == 'true'
        env:
          HAS_CERT: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 != '' }}
        run: |
          APP=$(ls -d release/mac*/Peer.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/Resources/opencode/opencode"
          spctl --assess --type execute --verbose "$APP" || echo "::warning::Gatekeeper assessment failed (not notarized?)"

      - name: Smoke test packaged app (macOS)
        if: runner.os == 'macOS'
        run: node scripts/smoke-packaged.mjs

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "$(uname -m)" = "aarch64" ]; then
            # electron-builder's bundled fpm (used for .deb) is x86_64-only.
            sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential
            sudo gem install --no-document fpm
            export USE_SYSTEM_FPM=true
          fi
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Install runtime dependencies for headless Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libfuse2t64

      - name: Smoke test unpacked app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs

      - name: Smoke test AppImage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.mjs --appimage

      - name: Install .deb and smoke test the installed app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/*.deb
          xvfb-run -a node scripts/smoke-packaged.mjs --exec /opt/Peer/peer

      - uses: actions/upload-artifact@v4
        with:
          name: peer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
